name: Atualizar painel do perfil

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/profile-summary-cards.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar painel de atividade e linguagens
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: fernandocerqueira1990-cloud
          repositories: fernandocerqueira1990-cloud/health-prospect-crm,fernandocerqueira1990-cloud/chatbot-servicos-publicos-python,fernandocerqueira1990-cloud/it-ops-toolkit
          committer_branch: main
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 60
          config_timezone: America/Sao_Paulo
